name: Publish Astro to SPanel deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    name: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production site
        env:
          PUBLIC_BUILD_SHA: ${{ github.sha }
        run: npm run build
      - name: Validate generated site
        run: npm run verify:dist
      - name: Publish production artifact to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: false
          # SPanel is responsible for pulling its checkout and serving the
          # generated files. This job does NOT SSH to the production server.
